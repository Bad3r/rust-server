# Negative values cannot be launch arguments: Facepunch.CommandLine parses "-1" as a switch of its own and
# replays the orphaned +app.port as "app.port 1". -1 skips the Rust+ companion server entirely.
app.port -1

# Vehicle decay off. Each ~60 s tick removes MaxHealth/decayminutes, so 0 kills on the first tick; 1e9 minutes
# needs about 1900 years of uptime. traincar.decayminutes is the idle despawn timer of workcarts and wagons.
playerhelicopter.insidedecayminutes 1000000000
playerhelicopter.outsidedecayminutes 1000000000
playerboat.decayminutes 1000000000
motorrowboat.outsidedecayminutes 1000000000
motorrowboat.deepwaterdecayminutes 1000000000
tugboat.tugdecayminutes 1000000000
basesubmarine.outsidedecayminutes 1000000000
basesubmarine.deepwaterdecayminutes 1000000000
snowmobile.outsidedecayminutes 1000000000
basesiegeweapon.outsidedecayminutes 1000000000
ridablehorse.decayminutes 1000000000
bike.outsidedecayminutes 1000000000
hotairballoon.outsidedecayminutes 1000000000
modularcar.outsidedecayminutes 1000000000
traincar.decayminutes 1000000000

# Solo play. Populations that scale with the server's population lerp from min to max by players/maxplayers, so one
# player of four got 62.5% of the spawn density and respawn rate; min 1 gives the full amount. decay.scale
# multiplies every decay tick, so 0 stops building decay. Locked crates open in 5 minutes instead of 15, and a
# player corpse lasts 30 minutes instead of 5.
spawn.min_density 1
spawn.min_rate 1
decay.scale 0
hackablelockedcrate.requiredhackseconds 300
server.corpsedespawn 1800

# Event delays count in-game hours, and TimeOfDay's 60-minute day and 10-minute night make 24 of them 70 real
# minutes, so 21 to 41 is about 1 to 2 hours of play. Vanilla: chinook 27-54, cargo 45-78, patrol_heli 36-54.
# Airdrops keep their vanilla 9-18. A running countdown keeps its old length; EventSchedule.Awake applies these.
events.set_event_min_delay chinook 21
events.set_event_max_delay chinook 41
events.set_event_min_delay cargo 21
events.set_event_max_delay cargo 41
events.set_event_min_delay patrol_heli 21
events.set_event_max_delay patrol_heli 41

# The Deep Sea opens right after a wipe and reopens 30 minutes after closing instead of 90.
deepsea.openonserverwipe true
deepsea.wipecooldownmin 1800
deepsea.wipecooldownmax 1800
